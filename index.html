<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discover Stories</title><script src="auth.js"></script>
<style>
:root{--bg:#101119;--panel:#191b27;--panel2:#222536;--line:#303448;--text:#f3f2f8;--muted:#999caf;--purple:#8065e8;--purple2:#a18cf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,sans-serif}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;padding:26px 18px;background:#171925;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
.brand{font-size:21px;font-weight:800;letter-spacing:-.6px;padding:4px 10px 30px}.brand span{color:var(--purple2)}
.nav-label{font-size:10px;color:#777d92;font-weight:700;letter-spacing:1.3px;padding:0 11px 10px}.nav{display:grid;gap:6px}
.nav a{color:#b9bbca;text-decoration:none;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:14px}.nav a:hover,.nav a.active{background:#29263d;color:#fff}.nav .ico{width:20px;text-align:center}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.user{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-bottom:12px}.logout{border:1px solid var(--line);color:#ddd;background:transparent;padding:9px 12px;border-radius:8px;width:100%;cursor:pointer}
main{margin-left:248px;padding:38px clamp(20px,4vw,58px);max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}.eyebrow{color:var(--purple2);font-size:11px;letter-spacing:1.6px;font-weight:800;text-transform:uppercase}h1{font-size:32px;margin:5px 0 0;letter-spacing:-1px}.top-right{display:flex;gap:10px;align-items:center}.wallet{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;text-decoration:none;color:#f4d77a}
.btn{border:0;border-radius:9px;background:var(--purple);color:white;padding:11px 16px;font-weight:700;text-decoration:none;cursor:pointer;font:inherit;font-size:13px}.btn:hover{filter:brightness(1.1)}.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 220px;gap:12px;margin-bottom:24px}.search-wrap{position:relative}.search-wrap span{position:absolute;left:14px;top:11px;color:var(--muted)}input,select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:inherit;outline:none}input{padding-left:40px}input:focus,select:focus{border-color:var(--purple)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 15px}.section-head h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.story{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.18s;min-width:0}.story:hover{transform:translateY(-3px);border-color:#7660cf}.cover{height:125px;background:linear-gradient(135deg,#312951,#202b42);display:flex;align-items:center;justify-content:center;font-size:42px}.story-body{padding:16px;display:flex;flex-direction:column;gap:10px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:20px;background:#2c2940;color:#c7baff}.tag.nsfw{background:#3c202e;color:#ff9db2}.story h3{font-size:16px;margin:0;line-height:1.35}.desc{color:var(--muted);font-size:12px;line-height:1.55;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:11px;color:#85899d;display:flex;justify-content:space-between}.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:14px}.empty h3{color:white;margin:0 0 8px}
@media(max-width:760px){.sidebar{width:68px;padding:20px 8px}.brand{font-size:0;padding:8px 5px 25px}.brand:first-letter{font-size:22px}.nav-label,.nav a .nav-text,.user,.logout{display:none}.nav a{justify-content:center;padding:13px 4px}.nav .ico{font-size:18px}.sidebar-bottom{padding:12px 0 0}main{margin-left:68px;padding:25px 16px}.toolbar{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:27px}}
</style></head>
<body><aside class="sidebar">
 <div class="brand">✦ Story<span>Verse</span></div>
 <div class="nav-label">MENU</div><nav class="nav">
  <a class="active" href="index.html"><span class="ico">▦</span><span class="nav-text">Discover</span></a>
  <a href="history.html"><span class="ico">◷</span><span class="nav-text">Riwayat Chat</span></a>
  <a href="shop.html"><span class="ico">◈</span><span class="nav-text">Shop</span></a>
  <a href="settings.html"><span class="ico">⚙</span><span class="nav-text">Setting</span></a>
  <a href="account.html"><span class="ico">◉</span><span class="nav-text">Account</span></a>
 </nav><div class="sidebar-bottom"><div class="user" id="me">Memuat akun…</div><button class="logout" onclick="logout()">Keluar</button></div>
</aside>
<main><header class="top"><div><div class="eyebrow">Your next adventure</div><h1>Discover Stories</h1></div><div class="top-right"><a class="wallet" href="shop.html">◈ <span id="coinBalance">—</span> koin</a><a class="btn" href="create.html">＋ Buat Cerita</a></div></header>
 <section class="toolbar"><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="Cari judul atau deskripsi cerita…"></div><select id="genre"><option value="">Semua Genre</option></select></section>
 <div class="section-head"><h2>Jelajahi cerita</h2><span class="count" id="count"></span></div><section class="grid" id="storyList"><div class="empty">Memuat cerita…</div></section>
</main>
<script>
const $=id=>document.getElementById(id);let stories=[];
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request gagal');return d}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='login.html'}
function genres(){return [...new Set(stories.flatMap(s=>Array.isArray(s.genres)?s.genres:(s.genre?[s.genre]:[])).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function render(){const q=$('search').value.trim().toLowerCase(),g=$('genre').value;const list=stories.filter(s=>(!g||(s.genres||[s.genre]).includes(g))&&(!q||`${s.title||''} ${s.story_description||''}`.toLowerCase().includes(q)));$('count').textContent=`${list.length} cerita`;
 $('storyList').innerHTML=list.length?list.map(s=>`<article class="story" onclick="openStory('${esc(s.id)}')"><div class="cover">✦</div><div class="story-body"><div class="tags">${(s.genres||[s.genre].filter(Boolean)).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}${s.nsfw?'<span class="tag nsfw">NSFW</span>':'<span class="tag">SFW</span>'}</div><h3>${esc(s.title||'Tanpa judul')}</h3><div class="desc">${esc(s.story_description||'Belum ada deskripsi.')}</div><div class="meta"><span>♙ ${s.characters?.length||0} karakter</span><span>Detail cerita →</span></div></div></article>`).join(''):'<div class="empty"><h3>Tidak ada cerita ditemukan</h3>Coba kata kunci atau genre lain.</div>'}
function openStory(id){location.href='detail.html?id='+encodeURIComponent(id)}
async function init(){try{const [me,data,wallet]=await Promise.all([api('/api/me'),api('/api/stories'),api('/api/wallet').catch(()=>({coins:0}))]);$('me').textContent=me.name||me.email; $('coinBalance').textContent=wallet.coins??0;stories=data;genres().forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;$('genre').append(o)});render()}catch(e){$('storyList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
$('search').addEventListener('input',render);$('genre').addEventListener('change',render);init();
</script></body></html>
