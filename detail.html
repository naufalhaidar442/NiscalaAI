<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Cerita</title><script src="auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101119;color:#f3f2f8;font:15px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 22px}.back{color:#aaa;text-decoration:none}.hero{margin-top:22px;padding:34px;background:linear-gradient(120deg,#292343,#1b263b);border:1px solid #3b3658;border-radius:18px}.eyebrow{color:#b7a6ff;text-transform:uppercase;font-size:11px;letter-spacing:1.5px;font-weight:800}.hero h1{font-size:34px;margin:10px 0}.muted{color:#a5a7b8;line-height:1.7}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tag{background:#34304b;color:#d4caff;border-radius:20px;padding:5px 10px;font-size:11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{border:0;border-radius:9px;background:#8065e8;color:white;padding:12px 18px;text-decoration:none;font-weight:700;cursor:pointer}.btn.alt{background:#292d3e;border:1px solid #45495c}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:18px}.panel{background:#191b27;border:1px solid #303448;border-radius:14px;padding:22px}.panel h2{font-size:16px;margin:0 0 14px}.character{padding:12px;background:#242738;border-radius:10px;margin:9px 0}.character b{display:block}.opening{white-space:pre-wrap;max-height:260px;overflow:auto;color:#c6c7d2;line-height:1.65}.chatrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #303448}.chatrow:last-child{border:0}.small{font-size:12px;color:#9699aa}@media(max-width:700px){.cols{grid-template-columns:1fr}.hero{padding:24px}.hero h1{font-size:27px}}
</style></head><body><main class="wrap"><a class="back" href="index.html">← Kembali ke katalog</a><div id="content" class="muted" style="padding:50px 0">Memuat cerita…</div></main>
<script>
const $=id=>document.getElementById(id);let story;
async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request gagal');return d}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function startChat(){try{const id='chat_'+Date.now(),messages=story.opening_message?[{role:'assistant',content:story.opening_message}]:[];await api('/api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,storyId:story.id,title:'Chat '+new Date().toLocaleString('id-ID'),messages})});location.href='chat.html?chat='+encodeURIComponent(id)}catch(e){alert(e.message)}}
async function init(){try{const id=new URLSearchParams(location.search).get('id');if(!id)throw Error('Cerita tidak dipilih');story=await api('/api/stories/'+encodeURIComponent(id));const [chats,me]=await Promise.all([api('/api/chats?story='+encodeURIComponent(id)),api('/api/me')]);document.title=story.title;
$('content').innerHTML=`<section class="hero"><div class="eyebrow">Story profile</div><h1>${esc(story.title)}</h1><div class="tags">${(story.genres||[story.genre].filter(Boolean)).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}${story.nsfw?'<span class="tag">NSFW</span>':'<span class="tag">SFW</span>'}</div><p class="muted">${esc(story.story_description||'Belum ada deskripsi cerita.')}</p><div class="actions"><button class="btn" onclick="startChat()">Mulai Chat →</button>${story.ownerId===me.sub?`<a class="btn alt" href="create.html?id=${encodeURIComponent(story.id)}">Edit Cerita</a>`:''}</div></section><div class="cols"><section class="panel"><h2>Karakter (${story.characters?.length||0})</h2>${(story.characters||[]).map(c=>`<div class="character"><b>${esc(c.name)}</b><div class="small">${esc(c.description)}</div><p class="muted">${esc(c.identity)}</p></div>`).join('')||'<p class="muted">Belum ada karakter.</p>'}</section><section class="panel"><h2>Opening Message</h2><div class="opening">${esc(story.opening_message||'Tidak ada opening message.')}</div></section></div><section class="panel" style="margin-top:18px"><h2>Riwayat Chat Cerita Ini</h2>${chats.length?chats.map(c=>`<div class="chatrow"><div><b>${esc(c.title)}</b><div class="small">${c.messageCount} pesan · ${new Date(c.updatedAt).toLocaleString('id-ID')}</div></div><a class="btn alt" href="chat.html?chat=${encodeURIComponent(c.id)}">Buka</a></div>`).join(''):'<p class="muted">Belum ada chat untuk cerita ini.</p>'}</section>`;
}catch(e){$('content').textContent='Gagal memuat: '+e.message}}
init();
</script></body></html>
